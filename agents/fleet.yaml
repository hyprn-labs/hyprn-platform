# Agents fleet registry — the single declaration of agents (FLT-01).
#
# This is the only hand-edited agent declaration. agents/fleet-render emits
# agents/host/agents.txt, agents/wake/wake.json and
# infra/agents/fleet.auto.tfvars.json from this file; those outputs are
# committed and agents/fleet-validate plus tests/agents/checks/fleet.sh fail
# on any regen diff or schema violation. Consumers (provision.sh, wake
# provision, Terraform) keep reading the generated files until migrated one
# at a time.
#
# Ada runs as a Workspace group until the M3 group-to-user move (owner
# console step); the value `group` is that transient pre-move state.

wake:
  project: hyprn-agents
  zone: europe-west1-b
  host: hyprn-agents-host-01

agents:
  - name: ada
    uid: 20001
    kind: engineering
    harness: claude
    display: "Ada (AI agent)"
    github:
      app: ada-agent-hyprn
      app_id: 5299141
      installation_id: 170941397
      bot_id: 341930344
      repos: all
    slack: true
    workspace: group
  - name: codd
    uid: 20002
    kind: engineering
    harness: opencode
    display: "Codd (AI agent)"
    github:
      app: codd-agent-hyprn
      app_id: 5306008
      installation_id: 171119571
      bot_id: 342187193
      repos:
        - hyprn-platform
        - hyprn-mvp
    slack: false
    workspace: none
