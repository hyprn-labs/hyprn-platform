# Observe-mode explicit forward proxy for agent egress (EGR-01, Phase 1).
#
# Owner direction (observe-first): this proxy ALLOWS all destinations and LOGS
# per agent; enforcement comes later (Phase 7, EGR-02). Nothing in this loaded
# config denies or allowlists: no dstdomain ACL, no http_access deny rule, and
# no fail-closed render gate in the observe path. Per-agent attribution comes
# solely from the listen port (%lp below): 3128 ada, 3129 codd.
#
# The enforce variant (destination allowlist + default-deny + fail-closed
# render gate) is NOT loaded here; it lives in
# runbooks/agents/egress-enforce.md and ships only with the Phase 7 flip.
# agents/policy/egress-allowlist.txt is the future Phase 7 list (declared
# destinations plus the first-observation update procedure); it is explicitly
# UNENFORCED while observe mode runs — provisioning must not render it or
# reference it until the flip.
#
# Rendered by host provisioning to /etc/squid/conf.d/hyprn.conf (path to
# confirm on the host at provisioning time). One listen port per agent from
# the fleet registry: 3128 ada, 3129 codd (Boole has no dedicated Squid port;
# Boole loop destinations traverse the shared container path via the owning
# user's port and are logged under that port).
#
# Cloud Logging ship path: ops-agent tails /var/log/squid/access.log with the
# local-port field as the agent label; if ops-agent is absent on the host,
# fall back to the host syslog shipper. Which shipper is present must be
# confirmed on the host at provisioning (RESEARCH open question 2).
#
# Proxy environment delivery: each agent user gets
# http_proxy/https_proxy=http://127.0.0.1:<own-port> via
# /etc/profile.d/hyprn-agents.sh (per-UID port selection alongside the
# existing PATH/DOCKER_HOST exports), and rootless containers inherit the
# owning user's environment so container traffic is attributed to the owner.
# Direct-connection attempts must bypass the proxy (curl --noproxy '*') so
# they exercise the nftables drop rules rather than the proxy.
http_port 3128 name=ada
http_port 3129 name=codd

acl ada_port myportname ada
acl codd_port myportname codd

# Observe mode: allow all destinations on each agent port (no blocking).
http_access allow ada_port
http_access allow codd_port

# %lp is the local (listen) port: 3128 -> ada, 3129 -> codd.
# No http_access deny rule is configured: every request arriving on these
# ports is allowed and logged (Squid's implicit default can only match traffic
# on ports this file does not listen on, of which there are none).
logformat hyprn %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %lp %un
access_log /var/log/squid/access.log hyprn

# nftables drop-direct is unchanged (agents/host/files/egress.nft): forcing
# traffic through the proxy is correct for both observe and enforce modes.
coredump_dir /var/spool/squid
