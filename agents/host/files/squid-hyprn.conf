# Enforce-mode explicit forward proxy for agent egress (EGR-02, Phase 7).
#
# Rendered by host provisioning to /etc/squid/conf.d/hyprn.conf (path to
# confirm on the host at provisioning time). One listen port per agent from
# the fleet registry: 3128 ada, 3129 codd (Boole has no dedicated Squid port;
# Boole loop destinations are enforced on the shared container path via the
# owning user's port). Enforce mode per EGR-02: per-port access controls bind
# each port to its agent, requests to allowlisted destinations are allowed,
# everything else is denied (default-deny, fail-closed), and every request is
# logged with the local port as the per-request agent identifier.
#
# Generated ACL: provisioning renders agents/policy/egress-allowlist.txt to
# /etc/squid/hyprn-allowlist.acl (strip comments/blank lines, sort unique).
# Fail-closed rule: an empty render aborts the reload and keeps the old ACL
# file; a missing ACL file must never mean "allow all". The Squid config parse
# pre-check (squid -k parse) runs before every reload; see
# runbooks/agents/egress-enforce.md for the render, rollback, and
# first-live-observation procedures.
#
# Subdomain form: confirm the leading-dot dstdomain subdomain form against the
# host Squid version at apply time (RESEARCH A1); safe fallback is explicit
# per-FQDN entries for each observed hostname.
#
# Cloud Logging ship path: ops-agent tails /var/log/squid/access.log with the
# local-port field as the agent label; if ops-agent is absent on the host,
# fall back to the host syslog shipper. Which shipper is present must be
# confirmed on the host at provisioning (RESEARCH open question 2).
#
# Proxy environment delivery: each agent user gets
# http_proxy/https_proxy=http://127.0.0.1:<own-port> via
# /etc/profile.d/hyprn-agents.sh (per-UID port selection alongside the
# existing PATH/DOCKER_HOST exports), and rootless containers inherit the
# owning user's environment so container traffic is attributed to the owner.
# Direct-connection attempts must bypass the proxy (curl --noproxy '*') so
# they exercise the nftables drop rules rather than the proxy.
http_port 3128 name=ada
http_port 3129 name=codd

acl allowlist dstdomain "/etc/squid/hyprn-allowlist.acl"
acl ada_port myportname ada
acl codd_port myportname codd

http_access allow ada_port allowlist
http_access allow codd_port allowlist
http_access deny ada_port
http_access deny codd_port
http_access deny all

# %lp is the local (listen) port: 3128 -> ada, 3129 -> codd.
logformat hyprn %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %lp %un
access_log /var/log/squid/access.log hyprn

# Enforce mode: destination allowlist enforced per port with default-deny tail.
# Rollback to observe mode is a reviewed one-command revert; see
# runbooks/agents/egress-enforce.md. nftables drop-direct is unchanged
# (agents/host/files/egress.nft): forcing traffic through the proxy is correct
# for both observe and enforce modes.
coredump_dir /var/spool/squid
