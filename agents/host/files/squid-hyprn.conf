# Explicit forward proxy for agent egress observation (D-05, Phase 1 EGR-01).
#
# Rendered by host provisioning to /etc/squid/conf.d/hyprn.conf (path to
# confirm on the host at provisioning time). One listen port per agent from
# agents/host/agents.txt: 3128 ada, 3129 codd. Observe mode per D-06: per-port
# access controls bind each port to its agent, every request is logged with
# the local port as the per-request agent identifier, and there are NO
# blocking rules.
#
# Cloud Logging ship path: ops-agent tails /var/log/squid/access.log with the
# local-port field as the agent label; if ops-agent is absent on the host,
# fall back to the host syslog shipper. Which shipper is present must be
# confirmed on the host at provisioning (RESEARCH open question 2).
#
# Proxy environment delivery: each agent user gets
# http_proxy/https_proxy=http://127.0.0.1:<own-port> via
# /etc/profile.d/hyprn-agents.sh (per-UID port selection alongside the
# existing PATH/DOCKER_HOST exports), and rootless containers inherit the
# owning user's environment so container traffic is attributed to the owner.
# Direct-connection attempts must bypass the proxy (curl --noproxy '*') so
# they exercise the nftables drop rules rather than the proxy.
http_port 3128 name=ada
http_port 3129 name=codd

acl ada_port myportname ada
acl codd_port myportname codd

http_access allow ada_port
http_access allow codd_port
http_access deny all

# %lp is the local (listen) port: 3128 -> ada, 3129 -> codd.
logformat hyprn %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %lp %un
access_log /var/log/squid/access.log hyprn

# Observe mode: no http_access deny beyond the default, no SSL bump, no
# destination allowlist. Enforcement arrives in M3 (EGR-02, Phase 7).
coredump_dir /var/spool/squid
