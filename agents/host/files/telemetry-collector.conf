# Host-local OTEL collector (Phase 2 OBS-01): receives seat telemetry batches
# over loopback only and lands per-agent per-day aggregates the daily digest
# reads. The collector binary is installed at apply time (pinned release plus
# checksum gate, herdr treatment); until then ada-digest runs in fallback
# aggregate-file mode (decision recorded in
# runbooks/agents/engineering-workflow.md).
#
# Spike evidence (2026-10-13): a trivial local OTLP listener on 127.0.0.1:4317
# received a seat-shaped http/protobuf batch to /v1/metrics without loss, so a
# host-local collector is viable and seat env points at it (provision.sh
# OTEL_EXPORTER_OTLP_ENDPOINT). Loss characteristics of the real collector are
# validated on-host post-apply; the digest always states its lower-bound caveat.

receivers:
  otlp:
    protocols:
      http:
        # Loopback only: seat sessions are local, nothing else may push here.
        endpoint: 127.0.0.1:4317

processors:
  batch: {}
  attributes/agent:
    actions:
      # Seats set service.name to their agent name; bucket per agent per day.
      - key: agent
        from_attribute: service.name
        action: upsert

exporters:
  file/telemetry:
    # One JSON record per batch; ada-digest aggregates per agent per day over
    # claude_code.token.usage, claude_code.cost.usage, session and limit-hit
    # events. Absent file means fallback mode (digest reports zeros + caveat).
    path: /var/lib/hyprn-agents/telemetry/batches.jsonl
    rotation:
      max_megabytes: 10
      max_backups: 7

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch, attributes/agent]
      exporters: [file/telemetry]
    logs:
      receivers: [otlp]
      processors: [batch, attributes/agent]
      exporters: [file/telemetry]
