# Egress observation proxy for agent users (EGR-01). Observe mode: every
# request from this host is allowed and logged with the agent it came from;
# nothing is cached or refused. Ports per agent and this host's address are in
# /etc/hyprn-agents/squid-agents.conf, written by provision.sh from agents.txt.
acl from_host src 127.0.0.1/32
include /etc/hyprn-agents/squid-agents.conf

http_access allow from_host
http_access deny all

cache deny all
via off
forwarded_for delete
shutdown_lifetime 3 seconds

logformat hyprn %{%Y-%m-%dT%H:%M:%S}tl agent=%{agent}note method=%rm url=%ru status=%>Hs bytes=%<st ms=%tr
access_log daemon:/var/log/squid/access.log logformat=hyprn
cache_log /var/log/squid/cache.log
coredump_dir /var/spool/squid
